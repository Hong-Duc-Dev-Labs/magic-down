<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MagicDown — Tải toàn bộ trang</title>
  <link rel="stylesheet" href="batch-picker.css" />
</head>
<body>
  <div class="picker-app">
    <header class="picker-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div class="brand-meta">
          <h1 class="brand-title" data-i18n="batch.title">MagicDown — Tải toàn bộ trang</h1>
          <div id="pageSourceLabel" class="page-source" data-i18n="batch.loading">Đang tải danh sách tài nguyên...</div>
        </div>
      </div>

      <div class="header-controls">
        <label class="subfolder-box" data-i18n-title="batch.subfolder_title" title="Thư mục con trong thư mục tải xuống của MagicDown">
          <span data-i18n="batch.subfolder_label">Thư mục con:</span>
          <input type="text" id="subfolderInput" data-i18n-placeholder="batch.subfolder_placeholder" placeholder="Tên thư mục (tuỳ chọn)" autocomplete="off" />
        </label>
        <button id="rescanBtn" class="btn-secondary" type="button" data-i18n="batch.rescan">Quét lại</button>
      </div>
    </header>

    <section class="toolbar">
      <div class="category-tabs" role="tablist">
        <button class="cat-tab active" data-category="image" role="tab" aria-selected="true">
          <span data-i18n="batch.tab_image">Ảnh</span> <span id="countImage" class="badge">0</span>
        </button>
        <button class="cat-tab" data-category="media" role="tab" aria-selected="false">
          <span data-i18n="batch.tab_media">Video/Audio</span> <span id="countMedia" class="badge">0</span>
        </button>
        <button class="cat-tab" data-category="file" role="tab" aria-selected="false">
          <span data-i18n="batch.tab_file">Tài liệu/File</span> <span id="countFile" class="badge">0</span>
        </button>
        <button class="cat-tab" data-category="all" role="tab" aria-selected="false">
          <span data-i18n="batch.tab_all">Tất cả</span> <span id="countAll" class="badge">0</span>
        </button>
      </div>

      <div class="filter-controls">
        <select id="minSizeSelect" data-i18n-title="batch.min_size_title" title="Lọc kích thước ảnh tối thiểu để bỏ icon nhỏ">
          <option value="0" data-i18n="batch.min_size_0">Mọi kích thước ảnh</option>
          <option value="50" data-i18n="batch.min_size_50">Ảnh &ge; 50px</option>
          <option value="100" selected data-i18n="batch.min_size_100">Ảnh &ge; 100px (lọc icon)</option>
          <option value="200" data-i18n="batch.min_size_200">Ảnh &ge; 200px</option>
          <option value="400" data-i18n="batch.min_size_400">Ảnh &ge; 400px</option>
        </select>

        <input type="search" id="searchInput" data-i18n-placeholder="batch.search_placeholder" placeholder="Tìm theo tên, đuôi file (vd: jpg, pdf, zip)..." autocomplete="off" />

        <button id="selectAllBtn" class="btn-secondary" type="button" data-i18n="batch.select_all">Chọn tất cả</button>
        <button id="deselectAllBtn" class="btn-secondary" type="button" data-i18n="batch.deselect_all">Bỏ chọn</button>
      </div>
    </section>

    <div id="statusBanner" class="status-banner hidden" role="status"></div>

    <main class="picker-main">
      <div id="resourceContainer" class="resource-grid"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-title" data-i18n="batch.empty_title">Không tìm thấy tài nguyên phù hợp</div>
        <div class="empty-sub" data-i18n="batch.empty_sub">Thử đổi tab bộ lọc, giảm kích thước ảnh tối thiểu hoặc xoá từ khoá tìm kiếm.</div>
      </div>
    </main>

    <footer class="picker-footer">
      <div class="selection-summary">
        <span data-i18n="batch.summary_showing">Đang hiển thị</span> <strong id="visibleCount">0</strong> <span data-i18n="batch.summary_items">mục</span> &middot; <span data-i18n="batch.summary_selected">Đã chọn</span> <strong id="selectedCount">0</strong> <span data-i18n="batch.summary_items">mục</span>
      </div>
      <div class="footer-actions">
        <button id="downloadAllBtn" class="btn-secondary" type="button">Tải toàn bộ (0)</button>
        <button id="downloadSelectedBtn" class="btn-primary" type="button" disabled>Tải các mục đã chọn (0)</button>
      </div>
    </footer>
  </div>

  <script src="i18n.js"></script>
  <script src="batch-scanner.js"></script>
  <script src="batch-picker.js"></script>
</body>
</html>
