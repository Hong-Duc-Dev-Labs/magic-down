ShortDescription: Fast, IDM-inspired multi-segment Windows download manager with GPU native UI.
Description: >-
  MagicDown is a pure-Go Windows download manager featuring dynamic work-stealing
  multi-segment acceleration, expired link refresh, duplicate detection, live
  segment visualization, per-task speed limits, proxy support, SHA-256/MD5
  checksum verification, queue scheduling, batch URL pattern imports, and a
  Manifest V3 Chromium browser extension.
